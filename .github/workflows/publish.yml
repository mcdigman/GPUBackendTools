name: Build and publish wheels
on:
  release:
    types: [published]
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'release' }}
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.select.outputs.build }}
      publish: ${{ steps.select.outputs.publish }}
      core-suffix: ${{ steps.select.outputs.core-suffix }}
    steps:
      - name: initialize
        run: |
          {
            echo "GBTWHL_BUILD=false"
            echo "GBTWHL_CORE_SUFFIX=false"
            echo "GBTWHL_PUBLISH=false"
          } >> "$GITHUB_ENV"
      - name: build on commit message
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[ci:build-wheels]')
        run: |
          echo "GBTWHL_BUILD=true" >> "$GITHUB_ENV"
      - name: publish wheels on commit message
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[ci:publish-wheels]')
        run: |
          echo "GBTWHL_PUBLISH=true" >> "$GITHUB_ENV"
      - name: build wheels on manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "GBTWHL_BUILD=true" >> "$GITHUB_ENV"
      - name: build and publish on tag 'v*'
        if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')
        run: |
          {
            echo "GBTWHL_BUILD=true"
            echo "GBTWHL_PUBLISH=true"
          } >> "$GITHUB_ENV"
      - name: add core-suffix on non-official repo
        if: github.repository_id != '1050703408' # lisa-analysis-tools/GPUBackendTools
        run: |
          echo "GBTWHL_CORE_SUFFIX=true" >> "$GITHUB_ENV"
      - name: output results
        id: select
        run: |
          {
            echo "build=$GBTWHL_BUILD"
            echo "publish=$GBTWHL_PUBLISH"
            echo "core-suffix=$GBTWHL_CORE_SUFFIX"
          } >> "$GITHUB_OUTPUT"
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.setuptools_scm.outputs.value }}
    steps:
      # =========================
      # = I - Retrieve sources  =
      # =========================
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      # ===================================
      # = II - Prepare Python environment =
      # ===================================
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          activate-environment: true
      - run: |
          uv sync --locked --only-group scm
      # ========================
      # = III - Detect version =
      # ========================
      - name: Update version scheme
        run: |
          sed -i'' -e 's|version_scheme = "no-guess-dev"|version_scheme = "only-version"|g' pyproject.toml
          sed -i'' -e 's|local_scheme = "node-and-date"|local_scheme = "no-local-version"|g' pyproject.toml
      - name: Detect current version
        id: setuptools_scm
        run: |
          VERSION="$(python -m setuptools_scm)"
          echo "RUNNING CHECK $(python -m setuptools_scm)"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)*((a|b|rc)[0-9]+)?(\.post[0-9]+)?(\.dev[0-9]+)?$ ]]; then
            echo "::error::Unexpected version string."
            exit 1
          fi
          echo "::notice:: Detected version: ${VERSION}"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version: ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
  build:
    needs:
      - select
      - version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build Sdist and Wheel
        run: uv build --sdist --wheel --out-dir dist/ .
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{needs.version.outputs.version}}

      # =====================
      # = V. Upload wheels  =
      # =====================
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ strategy.job-index }}
          path: ./dist/*
          if-no-files-found: error
  
  publish:
    runs-on: ubuntu-latest
    environment: pypiconf
    defaults:
      run:
        shell: bash
    needs:
      - build
      - select
    if: github.event_name == 'release' && needs.select.outputs.publish == 'true'
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/
          merge-multiple: true
      - name: List wheels
        run: |
          ls -al dist/*
      - name: Install twine from PyPI
        uses: install-pinned/twine@c7ca21f7f66fc895b73cba784dc1d0e302e3b4a3 # 6.1.0
      - name: Publish release distributions to registry
        env:
          TWINE_NON_INTERACTIVE: "yes"
          TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
          TWINE_REPOSITORY: ${{ vars.TWINE_REPOSITORY }}
          TWINE_USERNAME: ${{ vars.TWINE_USERNAME }}
        run: |
          twine upload dist/*
